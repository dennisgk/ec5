name: BrachiFlex
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.dennisgk.brachiflex
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    OTHER_LDFLAGS: "$(inherited) -ObjC -lbrachiflex_mobile -lc++ -lresolv -liconv"
targets:
  BrachiFlex:
    type: application
    platform: iOS
    sources:
      - main.m
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../target/aarch64-apple-ios/release"
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: ImageIO.framework
      - sdk: CoreVideo.framework
schemes:
  BrachiFlex:
    build:
      targets:
        BrachiFlex: all
    archive:
      config: Release
